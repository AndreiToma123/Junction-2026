<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buying agent · Demo Kitchen Oy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F5F2;--card:#fff;--soft:#FAFAF8;--soft2:#FBFBF9;--ink:#1A1D21;--ink2:#3D4248;--mute:#5B6168;--line:#E3E4E6;--line2:#D5D7DA;--line3:#B9BCC1;--shadow:none;
--blue:#1F4FD1;--blue-t:#E7EEFC;--blue-t2:#F1F5FE;--blue-b:#C9D7F8;--green:#1D5E3A;--green-t:#E3F1E8;--green-t2:#F1F8F3;--green-b:#C6E2CF;--amber:#7A4300;--amber-t:#FCEFD9;--amber-t2:#FFF7EA;--amber-b:#F2D3A0;--amber-dot:#B86A00;--yellow:#E3B04B;
--red:#8B1D1D;--red-t:#F9E3E3;--red-t2:#FDF1F1;--red-b:#EBC4C4;--grey-t:#EFEFEF;--focus:#9DB6F2;--on-blue:#fff;color-scheme:light}
:root[data-theme="dark"]{--shadow:none;--bg:#111315;--card:#1B1E21;--soft:#202428;--soft2:#1E2125;--ink:#ECEDEE;--ink2:#C4C7CB;--mute:#9AA0A6;--line:#2E3338;--line2:#3A4046;--line3:#555C63;
--blue:#7FA2FF;--blue-t:#1D2A4A;--blue-t2:#18223A;--blue-b:#2C3E6B;--green:#7ED3A0;--green-t:#163126;--green-t2:#14261E;--green-b:#24503B;--amber:#F2C27A;--amber-t:#3A2A12;--amber-t2:#2E2312;--amber-b:#5C4420;--amber-dot:#E3A33F;--yellow:#B8892F;
--red:#FF9C9C;--red-t:#3D1C1C;--red-t2:#311818;--red-b:#5E2C2C;--grey-t:#2A2E33;--focus:#3E5EB8;--on-blue:#0B1020;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.45}
h1,h2,h3{font-family:'Space Grotesk',Inter,sans-serif;font-weight:600;margin:0}
h1{font-size:30px}h2{font-size:22px}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}
nav{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;min-height:64px}
.brand{white-space:nowrap;font-family:'Space Grotesk',Inter,sans-serif;font-weight:600;font-size:18px;margin-right:auto}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tabs a{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-radius:8px;color:var(--ink2);text-decoration:none;font-weight:500}
.tabs a.on{background:var(--blue-t);color:var(--blue);font-weight:600}
.badge{background:var(--blue);color:var(--on-blue);border-radius:999px;padding:1px 8px;font-size:12px;font-weight:600}
.me{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.me input{width:130px}
main{padding:28px 0 64px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.between{justify-content:space-between}
.mute{color:var(--mute)}.small{font-size:13px}
.label{font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
input[type=text],input[type=search],input[type=number],input[type=date],select,textarea{border:1px solid var(--line2);border-radius:10px;padding:0 12px;min-height:44px;background:var(--card);max-width:100%}
textarea{padding:12px 14px;width:100%;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
.btn{min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line2);background:var(--card);font-weight:600;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.big{min-height:52px;padding:0 28px;font-size:16px}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.55;cursor:default}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.t-approve{color:var(--amber);background:var(--amber-t)}.t-ask{color:var(--blue);background:var(--blue-t)}
.t-ok{color:var(--green);background:var(--green-t)}.t-bad{color:var(--red);background:var(--red-t)}.t-grey{color:var(--mute);background:var(--grey-t)}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:var(--soft);font-weight:500;font-size:14px}
.chip.on{background:var(--blue-t);border-color:var(--blue);color:var(--blue);font-weight:600}
/* requests */
.split{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.list{flex:1 1 290px;min-width:0;display:flex;flex-direction:column;gap:10px}
.detail{flex:999 1 600px;min-width:0}
.item{text-align:left;display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:12px;background:var(--soft2);border:2px solid var(--line);width:100%}
.item.on{background:var(--card);border-color:var(--blue)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:12px;background:var(--soft);border:1px solid var(--line)}
.tile b{font-size:17px;font-weight:600;line-height:1.3}
.tile.warn{background:var(--amber-t2);border-color:var(--amber-b)}.tile.warn b{color:var(--amber)}
.tile.ask{background:var(--blue-t2);border-color:var(--blue-b)}.tile.ask b{color:var(--blue)}
.tile.ok{background:var(--green-t2);border-color:var(--green-b)}.tile.ok b{color:var(--green)}
.tile.bad{background:var(--red-t2);border-color:var(--red-b)}.tile.bad b{color:var(--red)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--mute);padding:10px 12px;background:var(--soft);white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rule{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline;padding:10px 14px;border-radius:10px}
.rule .k{font-size:12px;font-weight:700;min-width:112px}
.passed{display:flex;gap:12px;padding:6px 2px;border-bottom:1px solid var(--line);font-size:14px}
.box{flex:1 1 280px;min-width:0;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.box.dashed{border-style:dashed;border-color:var(--line3)}
.box ul{margin:8px 0 0;padding-left:18px}.box li{margin:4px 0}
/* timeline */
.step{display:flex;gap:14px}
.dot{flex:none;width:26px;height:26px;border-radius:999px;background:var(--green);color:var(--on-blue);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.dot.warn{background:var(--amber-dot)}.dot.ask{background:var(--blue)}.dot.bad{background:var(--red)}
.rail{display:flex;flex-direction:column;align-items:center}.rail i{flex:1;width:2px;min-height:10px;background:var(--line)}
.step .body{padding-bottom:14px;min-width:0;flex:1}
.banner{padding:18px 20px;border-radius:12px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.banner h3{font-size:19px}
/* log */
tr.hist td{background:var(--soft);color:var(--ink2)}
/* rules */
.rulecard{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;padding:14px;background:var(--soft);border-radius:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--ink2)}
.checks{display:flex;flex-wrap:wrap;gap:10px;font-weight:400}
.diff{border-radius:10px;padding:12px 14px;background:var(--blue-t2);border:1px solid var(--blue-b);display:flex;flex-direction:column;gap:8px}
.diff .b{color:var(--ink2);text-decoration:line-through}.diff .a{font-weight:500}
.problem{border-radius:10px;padding:12px 14px;background:var(--red-t);color:var(--red);font-weight:500}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--on-blue);padding:12px 18px;border-radius:10px;font-weight:500;display:none;z-index:9;max-width:90vw}
/* quick, gentle motion */
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
#view>*{animation:rise .2s ease-out both}
#outcome>*,#subsBox>*,[data-fix-box]>*{animation:rise .2s ease-out both}
.btn,.chip,.item,.tabs a,input,select,textarea{transition:background-color .15s ease,border-color .15s ease,color .15s ease,box-shadow .15s ease,transform .08s ease}
.btn:active,.chip:active{transform:scale(.97)}
.btn:hover:not(:disabled),.chip:hover{border-color:var(--line3)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.item:hover{border-color:var(--line3)}
.item.on{box-shadow:0 0 0 3px var(--blue-t)}
details[open]>*:not(summary){animation:fade .2s ease-out}
.step{animation:rise .2s ease-out both}
#toast{transition:opacity .2s ease,transform .2s ease}
html{scroll-behavior:smooth}
body,nav,.card{transition:background-color .2s ease,color .2s ease,border-color .2s ease}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media (max-width:640px){h1{font-size:24px}.card{padding:16px}.me input{width:120px}nav{position:static}nav .wrap{padding-top:8px;padding-bottom:8px}.brand{flex-basis:100%}}
</style>
</head>
<body>
<nav><div class="wrap">
  <div class="brand">Demo Kitchen Oy · Buying agent</div>
  <div class="tabs" id="tabs">
    <a href="#/new" data-tab="new">New request</a>
    <a href="#/requests" data-tab="requests">Requests <span class="badge" id="badge" hidden>0</span></a>
    <a href="#/events" data-tab="events">Events</a>
    <a href="#/kitchen" data-tab="kitchen">Kitchen</a>
    <a href="#/log" data-tab="log">Audit log</a>
    <a href="#/rules" data-tab="rules">Rules</a>
  </div>
  <button class="btn" id="themeBtn" style="min-height:36px;padding:0 12px;gap:6px;font-size:14px" aria-label="Switch to dark mode" title="Switch light or dark mode"></button>
  <span class="pill t-grey" id="aiPill" title="">AI: …</span>
  <label class="me"><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Your name</span><input type="text" id="me" placeholder="Your name" autocomplete="name" title="Your name goes into the audit log"></label>
</div></nav>
<main><div class="wrap" id="view"></div></main>
<div id="toast" role="status"></div>

<script>
"use strict";
// ---------- small helpers
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const eur = n => n == null ? "–" : "€" + Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const num = n => Number(n).toLocaleString("en-US", { maximumFractionDigits: 2 });
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function niceDate(iso) { if (!iso) return "–"; const [y, m, d] = iso.slice(0, 10).split("-").map(Number); const dt = new Date(Date.UTC(y, m - 1, d)); return `${DAYS[dt.getUTCDay()]} ${d} ${MONTHS[m - 1]}`; }
function niceTime(iso) { return iso ? `${niceDate(iso)} ${iso.slice(11, 16)}` : "–"; }
async function api(path, opts) {
  const r = await fetch(path, opts && { method: opts.method || "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(opts.body) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { const d = data.detail; throw new Error(d?.problems ? d.problems.join(" ") : typeof d === "string" ? d : "Something went wrong (" + r.status + ")"); }
  return data;
}
let toastTimer;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; t.style.opacity = "0"; t.style.transform = "translate(-50%,8px)";
  requestAnimationFrame(() => { t.style.opacity = "1"; t.style.transform = "translate(-50%,0)"; });
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.opacity = "0"; setTimeout(() => t.style.display = "none", 200); }, 4500); }
const meInput = $("#me");
try { meInput.value = localStorage.getItem("me") || ""; } catch (e) {}
meInput.addEventListener("input", () => { try { localStorage.setItem("me", meInput.value); } catch (e) {} });
function me() { const v = meInput.value.trim(); if (!v) { meInput.focus(); toast("Type your name first (top right). It goes into the audit log."); } return v; }

api("/api/ai/status").then(a => { const el = $("#aiPill"); el.textContent = a.gemini ? "AI: Gemini" : "AI: simple mode"; el.className = "pill " + (a.gemini ? "t-ok" : "t-grey"); el.title = a.mode; }).catch(() => {});

const STATUS = {
  needs_approval: ["Needs approval", "t-approve"], ask_buyer: ["Needs your answer", "t-ask"], ordered: ["Ordered", "t-ok"],
  rejected: ["Rejected", "t-bad"], cannot_fulfil: ["Can't be done", "t-bad"], cancelled: ["Cancelled", "t-grey"], superseded: ["Closed: not needed", "t-grey"], basket: ["Several products", "t-grey"]
};
const RESULT = { pass: ["Passed", "t-ok"], approve: ["Needs approval", "t-approve"], ask: ["Ask buyer", "t-ask"], blocked: ["Can't be used", "t-bad"] };
const pill = (text, cls) => `<span class="pill ${cls}">${esc(text)}</span>`;
const statusPill = r => pill(...(STATUS[r.status] || [r.status, "t-grey"]));
const chosen = r => (r.options || []).find(o => o.option_id === r.chosen);
const needsAction = r => r.status === "needs_approval" || r.status === "ask_buyer";

// light / dark: follows the computer's setting until the person chooses (remembered in this browser)
const ICON_MOON = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>`;
const ICON_SUN = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`;
function applyTheme(t) { document.documentElement.dataset.theme = t; const b = $("#themeBtn");
  b.innerHTML = t === "dark" ? ICON_SUN + "Light" : ICON_MOON + "Dark"; b.setAttribute("aria-label", t === "dark" ? "Switch to light mode" : "Switch to dark mode"); }
(() => { let t = null; try { t = localStorage.getItem("theme"); } catch (e) {}
  applyTheme(t || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")); })();
$("#themeBtn").onclick = () => { const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; applyTheme(t); try { localStorage.setItem("theme", t); } catch (e) {} };
let REQS = [], USUAL = [];
api("/api/usual").then(u => { USUAL = u.items || []; }).catch(() => {});
async function loadRequests() {
  REQS = (await api("/api/requests")).reverse();
  const n = REQS.filter(needsAction).length, b = $("#badge");
  b.hidden = !n; b.textContent = n;
  return REQS;
}

// ---------- pieces shared by screens
function stockText(l) {
  const demo = l.demo_stock_override ? " (demo stock)" : "";
  if (l.stock_status === "known") return `${num(l.stock_amount)} in stock${demo}`;
  if (l.stock_status === "no_limit") return "No limit reported";
  if (l.stock_status === "unknown") return "Unknown (supplier product)";
  return "–";
}
function answerButtons(r) {
  if (r.ask_kind === "missing" && (r.ask_fields || []).length) {
    const f = r.ask_fields, id = esc(r.id);
    const tomorrow = new Date(Date.now() + 86400000).toISOString().slice(0, 10);
    return `<form class="row" data-fill-form="${id}" style="gap:10px;align-items:flex-end">
      ${f.includes("amount") ? `<label class="small" style="font-weight:600">How much<br><input type="number" name="amount" min="0.1" step="any" style="width:120px" required></label>` : ""}
      ${(f.includes("unit") || (f.includes("amount") && !(r.parsed || {}).unit)) && !f.includes("product") ? `<label class="small" style="font-weight:600">Unit<br><select name="unit"><option value="KG">kg</option><option value="L">litres</option></select></label>` : ""}
      ${f.includes("deadline") ? `<label class="small" style="font-weight:600">Needed by<br><input type="date" name="deadline" min="${tomorrow}" value="${(r.parsed || {}).deadline || ""}" required></label>` : ""}
      ${f.includes("product") ? `<label class="small" style="font-weight:600">Which product<br><select name="item_id" required><option value="">Choose…</option>${USUAL.map(i => `<option value="${esc(i.item_id)}">${esc(i.name)}</option>`).join("")}</select></label>` : ""}
      <button class="btn primary">Continue</button>
      ${f.includes("product") ? `<a class="small" href="#/new?text=${encodeURIComponent(r.text || "")}">or write it again</a>` : ""}
    </form>`;
  }
  if (r.ask_kind === "understanding") return `<button class="btn primary" data-answer="${esc(r.id)}" data-confirm="1">Yes, that's right</button>
    <a class="btn" href="#/new?text=${encodeURIComponent(r.text || "")}">No, let me rewrite it</a>`;
  const a1 = (r.request_checks || []).find(c => c.rule === "A1" && c.result === "ask" && c.facts?.usual);
  if (!a1) return `<a class="btn primary" href="#/new?text=${encodeURIComponent(r.text || "")}">Write the request again</a>`;
  const u = a1.facts.unit, usual = a1.facts.usual, asked = a1.facts.requested;
  return `<button class="btn primary" data-answer="${esc(r.id)}" data-amount="${usual}">Change to ${num(usual)} ${esc(u)}</button>
    <button class="btn" data-answer="${esc(r.id)}" data-confirm="1">Yes, I meant ${num(asked)} ${esc(u)}</button>
    <span class="row" style="gap:6px"><label class="small mute" for="amt-${esc(r.id)}">or another amount</label>
    <input type="number" id="amt-${esc(r.id)}" min="1" style="width:110px" placeholder="${esc(u)}">
    <button class="btn" data-answer="${esc(r.id)}" data-custom="1">Use it</button></span>`;
}
function outcomeBanner(r, withLink) {
  const o = chosen(r), link = withLink ? `<a class="btn" href="#/requests/${esc(r.id)}">Open details</a>` : "";
  const dl = (r.parsed || {}).deadline ? niceDate(r.parsed.deadline) : o ? niceDate(o.lines[0].available_date) : "";
  if (r.kind === "basket") {
    const kids = r.child_summaries || [], act = kids.filter(c => ["needs_approval", "ask_buyer", "cannot_fulfil"].includes(c.status)), done = kids.filter(c => !act.includes(c));
    const n = st => kids.filter(c => c.status === st).length;
    const head = [n("ordered") && `${n("ordered")} ordered`, n("needs_approval") && `${n("needs_approval")} need${n("needs_approval") === 1 ? "s" : ""} approval`,
      n("ask_buyer") && `${n("ask_buyer")} need${n("ask_buyer") === 1 ? "s" : ""} your answer`, n("cannot_fulfil") && `${n("cannot_fulfil")} can't be done`].filter(Boolean).join(" · ");
    const row = c => `<div class="row" style="gap:8px;padding:8px 0;border-top:1px solid var(--line)">${pill(...(STATUS[c.status] || [c.status, "t-grey"]))} <b>${esc(c.product || "?")}</b>
      <span class="small mute">${c.deadline ? "by " + esc(niceDate(c.deadline)) : ""}</span>
      <span class="small" style="color:var(--ink2);flex:1 1 260px">${esc(c.status === "ordered" ? c.delivery_message || "" : c.status === "needs_approval" ? (c.total != null ? eur(c.total) + " · waiting for a person" : "waiting for a person") : c.status === "ask_buyer" ? c.question || "" : c.reason || "")}</span>
      ${c.status === "needs_approval" ? `<a class="btn" href="#/requests/${esc(c.id)}">Approve or reject</a>` : c.status === "ask_buyer" ? "" : `<a href="#/requests/${esc(c.id)}" class="small">${esc(c.id)}</a>`}</div>
      ${c.status === "ask_buyer" ? `<div style="padding:0 0 10px" data-parent="${esc(r.id)}">${answerButtons({ ...c, text: c.text_raw })}</div>` : ""}`;
    return `<div class="card stack" style="gap:10px;${act.length ? "border-color:var(--amber-b)" : ""}"><div class="row between"><div><div class="label">${kids.length} products · one request each</div>
      <h3 style="margin-top:2px">${esc(head)}</h3></div>${link}</div>
      ${act.length ? `<div><div class="small" style="font-weight:700;color:var(--amber)">Needs you (${act.length})</div>${act.map(row).join("")}</div>` : ""}
      ${done.length ? `<details ${act.length ? "" : "open"}><summary style="cursor:pointer;font-weight:600;min-height:32px" class="small">Done (${done.length})</summary>${done.map(row).join("")}</details>` : ""}</div>`;
  }

const STEP_TITLE = { request: "Read the request", rules: "Checked a rule", search: "Searched the product list", lookup: "Asked Valio Aimo for price, stock and delivery",

  const canSubs = (r.parsed || {}).item_id && ["needs_approval", "rejected", "cannot_fulfil"].includes(r.status) && !r.replaced_by;
  const rs = !r.replaced_by && ["needs_approval", "rejected", "cannot_fulfil"].includes(r.status) ? r.restock : null;
  const waitBtn = rs && !rs.unknown ? `<button class="btn" data-wait-restock="${esc(r.id)}">Wait for the usual product: order all ${num((r.parsed || {}).amount)} ${esc(unit || ((r.parsed || {}).unit === "KG" ? "kg" : (r.parsed || {}).unit))} for ${esc(niceDate(rs.date))}</button>` : "";
  const waitNote = rs ? (rs.unknown ? `<div class="small mute">Waiting for a restock: Valio Aimo doesn't say when the usual product (${esc(rs.product_id)}) comes back, so the agent can't promise a date.</div>`
    : `<div class="small mute">Valio Aimo restocks the usual product on ${esc(niceDate(rs.date))} (+${num(rs.amount)} ${esc(unit || ((r.parsed || {}).unit === "KG" ? "kg" : (r.parsed || {}).unit || ""))}, demo data)${rs.after_deadline ? ": after your deadline, so only if the date can move" : ""}.</div>`) : "";
  const instead = (canUsualOnly || canSubs || rs) ? `<div class="stack" style="gap:8px"><div class="small" style="font-weight:600">${r.status === "needs_approval" ? "Or instead:" : "What you can do now:"}</div>
      <div class="row" style="gap:8px">${canUsualOnly ? `<button class="btn" data-usual-only="${esc(r.id)}">Order only the usual product${usualLine ? ` (${num(usualLine.litres)} ${esc(unit)})` : ""}</button>` : ""}
      ${waitBtn}${canSubs ? `<button class="btn" data-load-subs="${esc(r.id)}">Show recipe-compatible substitutes</button>` : ""}</div>${waitNote}
      ${canSubs ? `<div id="subsBox"></div>` : ""}</div>` : "";
  let decide = "";
  if (r.status === "needs_approval") decide = `<section class="stack" style="gap:14px;border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--soft)">
      <div class="row" style="gap:10px"><button class="btn primary big" data-decide="approve">Approve &amp; place order</button><button class="btn big" data-decide="reject">Reject</button>
        <span class="small mute">Price and stock are checked again when you approve. Your name goes into the audit log.</span></div>${instead}</section>`;
  else if (r.status === "ask_buyer") decide = `<section class="stack" style="gap:10px;border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--soft)">
      <div class="row">${answerButtons(r)}</div></section>`;
  else if (instead) decide = `<section style="border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--soft)">${instead}</section>`;
  // 4. ranking of everything the agent compared
  const ranked = (r.options || []).filter(x => x.rank != null).sort((x, y) => x.rank - y.rank);
  const cmp = r.options_compared;
  const ranking = ranked.length > 1 ? `<details ${r.status === "needs_approval" ? "open" : ""}><summary style="cursor:pointer;font-weight:600;min-height:32px">How the agent ranked the options${cmp ? ` (${cmp.usable + cmp.blocked} compared, ${cmp.usable} usable)` : ""}</summary>
      <div class="small mute" style="margin:6px 0 8px">Order of preference from the rulebook: fewest approvals → most of the usual product → lowest price.</div>
      <div class="scroll"><table style="min-width:640px"><thead><tr><th>#</th><th>Option</th><th class="num">Total</th><th class="num">Per ${esc(unit)}</th><th>Result</th><th>Why this place</th></tr></thead><tbody>
      ${ranked.map(x => `<tr ${x.option_id === r.chosen ? 'style="background:var(--blue-t2)"' : ""}><td><b>${x.rank}</b></td>
        <td>${x.lines.map(l => `${num(l.litres)} ${esc(unit)} ${esc(l.name)} <span class="mute">(${esc(l.product_id)})</span>`).join("<br>")}${x.option_id === r.chosen ? `<div class="small" style="color:var(--blue);font-weight:600">Chosen</div>` : ""}</td>
        <td class="num">${eur(x.total_with_tax)}</td><td class="num">${x.price_per != null ? eur(x.price_per) : "–"}</td>
        <td>${pill(...({ auto_order: ["Can order alone", "t-ok"], needs_approval: ["Needs approval", "t-approve"], blocked: ["Can't be used", "t-bad"] }[x.outcome] || [x.outcome, "t-grey"]))}</td>
        <td class="small">${esc(x.rank_reason || "")}</td></tr>`).join("")}</tbody></table></div>
      ${cmp && cmp.usable + cmp.blocked > ranked.length ? `<div class="small mute" style="margin-top:6px">Showing the top ${ranked.length}; the rest are in the audit log.</div>` : ""}</details>` : "";
  // 5. rule checks
  const rules = `<section><div class="label" style="margin-bottom:8px">Rule checks</div><div class="stack" style="gap:8px">
      ${problems.map(p => { const done = p.result === "approve" && r.decided_by ? (r.status === "ordered" ? ["Approved by " + r.decided_by, "t-ok"] : ["Rejected by " + r.decided_by, "t-bad"]) : RESULT[p.result];
        return `<div class="rule ${done[1]}"><span class="k">${esc(done[0])}</span><span style="color:var(--ink);flex:1 1 300px"><b>${esc(p.rule)} - ${esc(p.name)}.</b> ${esc(p.detail)}</span></div>`; }).join("")}
      ${passed.length ? `<button class="btn" id="togglePassed" data-rest=" the ${passed.length} passed checks" style="align-self:flex-start;color:var(--green)">Show the ${passed.length} passed checks</button>
      <div id="passed" hidden>${passed.map(p => `<div class="passed"><b style="flex:0 0 34px;color:var(--green)">${esc(p.rule)}</b><span style="flex:0 0 170px;font-weight:500">${esc(p.name)}</span><span style="color:var(--ink2)">${esc(p.detail)}</span></div>`).join("")}</div>` : ""}
    </div></section>`;
  // 6. footer: the less frequent actions
  const cancelBtn = ["needs_approval", "ask_buyer"].includes(r.status) ? `<button class="btn danger" data-cancel-req="${esc(r.id)}">Cancel request</button>`
    : r.status === "ordered" ? `<button class="btn danger" data-cancel-req="${esc(r.id)}">Cancel order ${esc(r.order_id)}</button>` : "";
  const links = [r.follow_up_of ? `Follow-up of <a href="#/requests/${esc(r.follow_up_of)}">${esc(r.follow_up_of)}</a>` : "",
    r.replaced_by ? `Replaced by <a href="#/requests/${esc(r.replaced_by)}">${esc(r.replaced_by)}</a>` : "",
    r.event_id ? `Part of event <a href="#/events/${esc(r.event_id)}">${esc(r.event_id)}</a>` : ""].filter(Boolean).join(" · ");
  const title = r.current_request ? r.current_request[0].toUpperCase() + r.current_request.slice(1) : r.text || "";
  return `<div class="card stack" style="gap:22px">
    <div class="row between" style="align-items:flex-start"><div><div class="small mute">${esc(r.id)} · received ${esc(niceTime(r.received_at))}${r.scenario ? " · demo scenario: " + esc(r.scenario) : ""}${links ? " · " + links : ""}</div>
      <h2 style="margin-top:4px">${r.origin === "typed" && !r.current_request ? "“" + esc(title) + "”" : esc(title)}</h2>
      ${r.current_request ? `<div class="small mute" style="margin-top:4px">${r.amount_changed_from != null ? `Amount changed by the buyer (was ${num(r.amount_changed_from)}). ` : ""}First written as: “${esc(r.text || "")}”</div>` : ""}</div>${statusPill(r)}</div>
    ${r.trigger ? `<div class="small" style="background:var(--blue-t2);border-radius:10px;padding:10px 14px"><b>${r.origin === "event" ? "Sent by the event planner." : "Sent automatically by the stock monitor."}</b> ${esc(r.trigger)}</div>` : ""}
    ${r.possible_duplicate && needsAction(r) ? `<div class="banner t-approve" style="padding:14px 16px"><div><div class="label" style="color:inherit">Possible duplicate</div>
      <div style="color:var(--ink);font-weight:500">This ingredient was ordered since this request (${esc(r.possible_duplicate.because)}). Kitchen now has ${num(r.possible_duplicate.stock)} in stock + ${num(r.possible_duplicate.on_way)} on its way (reorder level ${num(r.possible_duplicate.reorder_level)}).
      The agent did not close it because a person asked for it.</div></div><button class="btn" data-cancel-req="${esc(r.id)}">Close this request</button></div>` : ""}
    ${r.notice ? `<div class="banner ${r.notice.kind === "ok" ? "t-ok" : r.notice.kind === "changed" ? "t-approve" : "t-bad"}" style="padding:14px 16px"><div><div class="label" style="color:inherit">${r.notice.kind === "ok" ? "Re-checked at approval" : r.notice.kind === "changed" ? "Price changed · please look again" : "Re-check failed"}</div>
      <div style="font-weight:500;color:var(--ink)">${esc(r.notice.text)}</div></div></div>` : ""}
    ${r.summary ? `<div style="background:var(--bg);border-radius:12px;padding:14px 16px"><span class="label">${r.status === "needs_approval" ? "What needs deciding" : r.status === "ask_buyer" ? "What the agent needs" : "What happened"}</span>
      <span class="small mute"> · written by ${esc(r.summary.written_by)} from the data and rule results</span>
      <div style="margin-top:4px;font-size:16px">${r.summary.reason ? `${r.summary.situation ? esc(r.summary.situation) + " " : ""}<b>${esc(r.summary.reason)}</b>` : esc(r.summary.text)}</div></div>` : ""}
    ${tiles ? `<div class="tiles">${tiles}</div>` : ""}${lines}${decide}${ranking}${rules}
    ${r.substitute_note ? `<div class="small" style="background:var(--blue-t2);border-radius:10px;padding:10px 14px"><b>Chef's note on this swap:</b> ${esc(r.substitute_note)}</div>` : ""}
    <div class="row between" style="border-top:1px solid var(--line);padding-top:16px;gap:10px">
      <div class="row" style="gap:8px"><button class="btn" data-toggle-steps>Show the agent's ${r.steps.length} steps</button><a class="btn" href="#/log?request_id=${esc(r.id)}">Audit log for ${esc(r.id)}</a></div>${cancelBtn}</div>
    <div id="stepsBox" hidden>${timeline(r.steps)}</div>
  </div>`;
}
document.addEventListener("click", e => { const b = e.target.closest("[data-toggle-steps]"); if (!b) return; const box = $("#stepsBox"); box.hidden = !box.hidden;

// ---------- recipe-aware substitutes (stock-out and events)
function subsHtml(s, rid) {
  const u = s.unit === "KG" ? "kg" : s.unit;
  const head = s.combine_with_usual ? `Valio Aimo can deliver ${num(s.usual_available)} ${u} of the usual product by ${esc(niceDate(s.deadline))}. These can cover the missing ${num(s.needed)} ${u}:`
    : `These can replace ${num(s.needed)} ${u} of ${esc(s.name.toLowerCase())} by ${esc(niceDate(s.deadline))}:`;
  const opts = s.options.map(o => `<div class="rulecard"><div class="row between" style="align-items:flex-start;gap:8px 16px">
      <div style="flex:1 1 380px;min-width:0"><b style="color:var(--blue)">#${o.rank || "–"}</b> <b>${esc(o.name)}</b> <span class="small mute">${esc(o.product_id)} · ${esc(o.brand || "no brand")}</span>
        <div class="row" style="gap:6px;margin:4px 0">${pill(o.source, o.source === "chef's swap list" ? "t-ok" : o.source === "suggested by AI" ? "t-ask" : "t-grey")}
          ${o.pre_approved ? pill("pre-approved: agent may order alone", "t-ok") : pill("chef decides", "t-approve")}${o.fit ? pill("fit: " + o.fit, "t-grey") : ""}</div>
        ${o.rank_reason ? `<div class="small" style="font-weight:600">Why #${o.rank}: ${esc(o.rank_reason)}</div>` : ""}
        <div style="color:var(--ink2)">${esc(o.note)}</div>
        <div class="small mute" style="margin-top:4px">${num(o.amount)} ${u} · ${eur(o.total_with_tax)} incl. tax (${eur(o.price_per)}/${u}) · arrives ${esc(niceDate(o.available_date))} · ${o.stock_status === "known" ? num(o.stock_amount) + " in stock" : o.stock_status === "no_limit" ? "no stock limit" : "stock unknown"}</div></div>
      ${rid ? `<button class="btn primary" data-pick-sub="${esc(o.product_id)}" data-rid="${esc(rid)}">Use this</button>` : ""}</div></div>`).join("");
  const bad = s.not_usable.length ? `<div class="small mute">Checked but can't be used: ${s.not_usable.map(o => `${esc(o.name)} (${esc(o.why_not)})`).join("; ")}.</div>` : "";
  return `<div class="stack" style="gap:10px"><div class="small mute">Picked by ${esc(s.picked_by)} · checked live with Valio Aimo · ranked: pre-approved swaps → chef's list → AI fit → price</div>
    ${s.options.length ? `<div>${head}</div>${opts}` : `<div class="problem" style="background:var(--grey-t);color:var(--ink)">No product substitute can arrive by ${esc(niceDate(s.deadline))}.</div>`}${bad}</div>`;
}
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-load-subs]");
  if (b) { b.disabled = true; b.textContent = "Checking with Valio Aimo…"; const box = $("#subsBox");
    try { box.innerHTML = subsHtml(await api(`/api/requests/${b.dataset.loadSubs}/substitutes`), b.dataset.loadSubs); box.classList.remove("mute", "small"); b.remove(); }
    catch (err) { box.innerHTML = `<div class="problem">${esc(err.message)}</div>`; b.disabled = false; b.textContent = "Show substitutes"; } return; }
  const p = e.target.closest("[data-pick-sub]");
  if (p) { const by = me(); if (!by) return; p.disabled = true; p.textContent = "Ordering…";
    try { const r = await api(`/api/requests/${p.dataset.rid}/substitute`, { body: { product_id: p.dataset.pickSub, by } }); await loadRequests();
      toast(`New request ${r.id}: ${(STATUS[r.status] || [r.status])[0].toLowerCase()}.`); location.hash = "#/requests/" + r.id; if (CURRENT === "requests") route(); }

// ---------- screen: events (last-minute bookings)
const EV_STATE = { covered: ["From kitchen stock", "t-ok"], ordered: ["Ordered", "t-ok"], needs_approval: ["Waiting for approval", "t-approve"],
  ask_buyer: ["Needs an answer", "t-ask"], cannot_fulfil: ["Can't be sourced in time", "t-bad"], rejected: ["Rejected", "t-bad"], cancelled: ["Cancelled", "t-grey"],
  missing: ["Not ordered yet", "t-bad"] };
let EV_FORM = (() => { try { return JSON.parse(sessionStorage.getItem("evDraft") || "null"); } catch (e) { return null; } })();
// The event form is kept as a draft (in this browser tab) until it is planned: leaving the page loses nothing.
function saveEventDraft() {
  const f = document.querySelector("#evForm"); if (!f) return;
  const fd = new FormData(f);
  EV_FORM = { name: fd.get("name") || "", date: fd.get("date") || "", guests: fd.get("guests") || "", budget: fd.get("budget") || "", dishes: fd.getAll("dish"),
    read_by: (EV_FORM || {}).read_by, customs: [...document.querySelectorAll("#customDishes [data-dish-ed]")].map(readDish) };

}
const uu = x => x === "KG" ? "kg" : x;
function costBar(c) {
  if (c.budget == null) return `<div class="row between"><span><b>Event cost:</b> ${eur(c.ordered)} ordered${c.waiting_for_approval ? ` + ${eur(c.waiting_for_approval)} waiting for approval` : ""} = <b>${eur(c.total)}</b></span><span class="small mute">No event budget set</span></div>`;
  const pct = c.budget ? Math.min(100, Math.round(c.total / c.budget * 100)) : 100, ordPct = c.budget ? Math.min(100, Math.round(c.ordered / c.budget * 100)) : 100, over = c.total > c.budget;
  return `<div class="stack" style="gap:6px"><div class="row between"><span><b>Event cost:</b> ${eur(c.ordered)} ordered${c.waiting_for_approval ? ` + ${eur(c.waiting_for_approval)} waiting for approval` : ""} = <b>${eur(c.total)}</b> of ${eur(c.budget)} budget</span>
    <span class="pill ${over ? "t-bad" : "t-ok"}">${over ? eur(-c.left) + " over budget" : eur(c.left) + " left"}</span></div>
    <div style="height:10px;border-radius:5px;background:var(--grey-t);position:relative;overflow:hidden"><div style="position:absolute;inset:0 auto 0 0;width:${pct}%;background:${over ? "var(--red)" : "var(--yellow)"}"></div><div style="position:absolute;inset:0 auto 0 0;width:${ordPct}%;background:${over ? "var(--red)" : "var(--green)"}"></div></div>
    <div class="small mute">Green: ordered. Yellow: waiting for approval. Charged to the event's own budget, not the weekly ones.</div></div>`;
}
function ingredientRow(k, g) {

// One editor for a dish, used on the Kitchen menu and for event-only dishes.
function dishEditor(k, d, opts) {

function swapRow(sw, i) {

      <div class="row" style="gap:10px"><label class="row small" style="gap:6px;font-weight:600"><input type="checkbox" name="sw_pre" ${sw.pre_approved ? "checked" : ""}> Pre-approved (agent may order alone)</label>

function readDish(el) {

const SET_LABEL = { limit_eur: "Limit (€)", includes_tax: "Count tax in the total", max_ratio: "Times the usual amount", brands: "Brands (comma separated)",
  products: "Product codes (comma separated)", labels: "Labels (comma separated)", max_brands: "Max brands in one order", max_overshoot_pct: "Max extra from rounding (%)",
  min_score: "Minimum score (0 to 1)", if_unknown: "If the product has no score", if_stock_unknown: "If stock is unknown", if_buyer_confirms: "If the buyer confirms",
  if_new_item: "If the item was never ordered before", max_eur_per_litre: "Max price per litre (€)", required_fields: "The request must say" };
const CHOICE = { approve: "Needs approval", ask: "Ask the buyer", blocked: "Can't be used", pass: "Allow", allow_with_warning: "Allow, with a warning" };
let RULES = null;
function settingInput(key, spec, val) {
  const name = `s_${key}`, lab = esc(SET_LABEL[key] || key.replace(/_/g, " "));
  if (spec.kind === "bool") return `<label><span>${lab}</span><span class="checks"><label class="row" style="gap:6px;flex-direction:row"><input type="checkbox" name="${name}" ${val ? "checked" : ""}> Yes</label></span></label>`;
  if (spec.kind === "choice") return `<label>${lab}<select name="${name}">${spec.options.map(o => `<option value="${o}" ${o === val ? "selected" : ""}>${esc(CHOICE[o] || o)}</option>`).join("")}</select></label>`;
  if (spec.kind === "list" && spec.options) return `<label><span>${lab}</span><span class="checks">${spec.options.map(o => `<label class="row" style="gap:6px;flex-direction:row"><input type="checkbox" name="${name}" value="${o}" ${(val || []).includes(o) ? "checked" : ""}> ${esc(o)}</label>`).join("")}</span></label>`;
  if (spec.kind === "list") return `<label>${lab}<input type="text" name="${name}" value="${esc((val || []).join(", "))}"></label>`;
  return `<label>${lab}<input type="number" name="${name}" value="${esc(val ?? "")}" step="any" min="${spec.min}" max="${spec.max}"></label>`;
}
function readSettings(form, specs) {
  const out = {};
  for (const [key, spec] of Object.entries(specs)) {
    const els = [...form.querySelectorAll(`[name="s_${key}"]`)];
    if (spec.kind === "bool") out[key] = els[0].checked;
    else if (spec.kind === "list" && spec.options) out[key] = els.filter(e => e.checked).map(e => e.value);
    else if (spec.kind === "list") out[key] = els[0].value.split(",").map(s => s.trim()).filter(Boolean);
    else if (spec.kind === "number") out[key] = els[0].value === "" ? null : Number(els[0].value);
    else out[key] = els[0].value;
  }
  return out;
}
function ruleForm(type, rule) {
  return `<form class="stack" style="gap:12px" data-form><div class="form">
    <label>Name<input type="text" name="name" value="${esc(rule?.name || type.title)}"></label>
    ${Object.entries(type.settings).map(([k, spec]) => settingInput(k, spec, rule?.settings?.[k])).join("")}
    <label>If the rule is not met<select name="result">${type.results.map(o => `<option value="${o}" ${o === rule?.result ? "selected" : ""}>${esc(CHOICE[o] || o)}</option>`).join("")}</select></label>
  </div><div class="row"><button class="btn primary">Preview change</button><button type="button" class="btn" data-cancel>Cancel</button></div><div data-preview></div></form>`;
}
function previewHtml(p) {
  if (!p.ok) return `<div class="problem">${p.problems.map(esc).join("<br>")}</div>`;
  return `<div class="diff"><b>This is what will change. Nothing is saved yet.</b>${p.diff.map(d => `<div><span class="pill t-grey">${esc(d.change)} ${esc(d.rule_id)}</span>
    ${d.before ? `<div class="b">${esc(d.before)}</div>` : ""}${d.after ? `<div class="a">${esc(d.after)}</div>` : ""}</div>`).join("")}
    <div class="row"><button type="button" class="btn primary" data-apply>Apply change</button><span class="small mute">Saved with your name in the audit log. Can be undone.</span></div></div>`;
}

  let p; try { p = await api("/api/rules/preview", { body: payload }); } catch (e) { p = { ok: false, problems: [e.message] }; }

    ${RULES.default_yaml ? `<div class="card stack" style="gap:12px"><div class="row between"><div><b>Restore the default rules</b><div class="small mute">Puts back the original rulebook (the one the demo scenarios expect). You see what changes first.</div></div>
      <button class="btn" id="restoreBtn">Preview restore</button></div><div id="restoreBox"></div></div>` : ""}
    <div class="card stack" style="gap:12px;border-color:var(--red-b)"><h2>Start over</h2>
      <div class="mute">Puts everything back as if the app was opened for the first time: default rules, menu, kitchen stock and budgets; no requests, orders or events.
        The audit log is started fresh, with one line saying who did it.</div>
      <label class="row small" style="gap:8px"><input type="checkbox" id="withHistory"> Add the 3 weeks of example history (for trying "Ask the log")</label>
      <div><button class="btn danger" id="resetAll">Reset everything</button></div></div>
    <div class="card stack" style="gap:12px"><h2>Change history</h2>${changes.length ? changes.map(c => `<div class="rulecard"><div class="row between"><div><b>${esc(c.change_id)}</b> · ${esc(niceTime(c.time))} · by ${esc(c.by)} <span class="pill t-grey">${esc(c.source)}</span></div>
      <button class="btn" data-undo="${esc(c.change_id)}">Undo this change</button></div>${c.diff.map(d => `<div class="small"><b>${esc(d.change)} ${esc(d.rule_id)}</b>${d.before ? `<div class="mute">Before: ${esc(d.before)}</div>` : ""}${d.after ? `<div>After: ${esc(d.after)}</div>` : ""}</div>`).join("")}</div>`).join("")
      : `<div class="mute">No rule changes yet.</div>`}</div></div>`;
  const v = $("#view");
  $("#wishForm").onsubmit = async e => {
    e.preventDefault(); const text = $("#wish").value.trim(), box = $("#wishBox"); if (!text) return toast("Write what you want to change first.");
    box.innerHTML = `<div class="mute">Thinking…</div>`;
    try {
      const p = await api("/api/rules/propose", { body: { text } });
      if (p.status === "question") { box.innerHTML = `<div class="banner t-ask" style="padding:14px 16px"><div><div class="label" style="color:inherit">The agent has a question · nothing changed · by ${esc(p.proposed_by)}</div>
        <div style="font-size:16px;font-weight:500;color:var(--ink)">${esc(p.question)}</div><div class="small" style="color:var(--ink2)">Answer by rewriting your wish above.</div></div></div>`; $("#wish").focus(); return; }
      box.innerHTML = `<div class="small mute" style="margin-bottom:6px">Proposed by ${esc(p.proposed_by)}${p.explanation ? ": " + esc(p.explanation) : ""}</div><div data-preview></div>`;
      previewAndApply($("[data-preview]", box), { change: p.change, request_text: text }, "ai");
    } catch (err) { box.innerHTML = `<div class="problem">${esc(err.message)}</div>`; }
  };
  v.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => {
    const r = RULES.rules.find(x => x.id === b.dataset.edit), t = typeOf(r.type), slot = $("[data-slot]", b.closest("[data-rule]"));
    slot.innerHTML = ruleForm(t, r); const form = $("form", slot);
    $("[data-cancel]", form).onclick = () => slot.innerHTML = "";
    form.onsubmit = e => { e.preventDefault(); previewAndApply($("[data-preview]", form), { change: { action: "edit", rule_id: r.id, name: form.elements["name"].value, result: form.elements["result"].value, settings: readSettings(form, t.settings) } }, "manual"); };
  });
  v.querySelectorAll("[data-remove]").forEach(b => b.onclick = () => { const slot = $("[data-slot]", b.closest("[data-rule]")); slot.innerHTML = `<div data-preview></div>`; previewAndApply(slot.firstChild, { change: { action: "remove", rule_id: b.dataset.remove } }, "manual"); });
  $("#addBtn").onclick = () => {
    const addable = RULES.types.filter(t => !t.locked), box = $("#addBox");
    box.innerHTML = `<div class="card stack" style="gap:12px"><h2>Add a rule</h2><label class="small" style="font-weight:600">What kind of rule?<br>
      <select id="addType">${addable.map(t => `<option value="${t.type}">${esc(t.category)}: ${esc(t.title)}</option>`).join("")}</select></label><div id="addForm"></div></div>`;
    const draw = () => { const t = typeOf($("#addType").value); $("#addForm").innerHTML = ruleForm(t, null); const form = $("#addForm form");
      $("[data-cancel]", form).onclick = () => box.innerHTML = "";
      form.onsubmit = e => { e.preventDefault(); previewAndApply($("[data-preview]", form), { change: { action: "add", type: t.type, name: form.elements["name"].value, result: form.elements["result"].value, settings: readSettings(form, t.settings) } }, "manual"); }; };
    $("#addType").onchange = draw; draw(); box.scrollIntoView({ behavior: "smooth", block: "nearest" });
  };
  if ($("#restoreBtn")) $("#restoreBtn").onclick = () => previewAndApply($("#restoreBox"), { text: RULES.default_yaml }, "restore defaults");
  $("#resetAll").onclick = async () => { const by = me(); if (!by) return;
    const t = prompt("This deletes all requests, orders, events and rule changes, and starts a new audit log. It can't be undone.\n\nType RESET to confirm.");
    if (t !== "RESET") return toast("Nothing was reset.");
    try { await api("/api/admin/reset", { body: { by, confirm: "RESET", with_history: $("#withHistory").checked } }); FILTER = "approval"; toast("Everything is back to the defaults."); location.hash = "#/new"; route(); }
    catch (e) { toast(e.message); } };
  $("#yamlPreview").onclick = () => previewAndApply($("#yamlBox"), { text: $("#yaml").value }, "text");
  v.querySelectorAll("[data-undo]").forEach(b => b.onclick = async () => { const by = me(); if (!by) return; b.disabled = true;
    try { await api(`/api/rules/changes/${b.dataset.undo}/undo`, { body: { by } }); toast("Change undone."); viewRules(); } catch (e) { toast(e.message); b.disabled = false; } });
}

// ---------- router
let CURRENT = "";
async function route() {
  const [path, query] = (location.hash.slice(1) || "/new").split("?"), parts = path.split("/").filter(Boolean), params = new URLSearchParams(query || "");
  CURRENT = parts[0] || "new";
  document.querySelectorAll("#tabs a").forEach(a => a.classList.toggle("on", a.dataset.tab === CURRENT));
  try {
    if (CURRENT === "requests") await viewRequests(params, parts[1]);
    else if (CURRENT === "log") { await loadRequests(); await viewLog(params); }
    else if (CURRENT === "rules") { loadRequests(); await viewRules(); }
    else if (CURRENT === "kitchen") { loadRequests(); await viewKitchen(); }
    else if (CURRENT === "events") { loadRequests(); await viewEvents(parts[1]); }
    else { loadRequests(); await viewNew(params); }
  } catch (e) { $("#view").innerHTML = `<div class="problem">Could not load this screen: ${esc(e.message)}</div>`; }
  window.scrollTo(0, 0);
  // on a phone the list sits above the details: jump to the request that was tapped
  if (CURRENT === "requests" && parts[1] && window.innerWidth < 900) $(".detail")?.scrollIntoView();
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
